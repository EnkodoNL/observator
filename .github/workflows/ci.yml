# SPDX-License-Identifier: FSL-1.1-ALv2
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node ../scripts/check-spdx.mjs
      - run: node ../scripts/check-licenses.mjs

  reporter:
    name: Reporter (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reporter
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: reporter/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  e2e:
    name: Compose stack and Dockerfile snippet
    runs-on: ubuntu-latest
    needs: [check, reporter]
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: |
          cp .env.example .env
          sed -i 's#^PB_SUPERUSER_PASSWORD=.*#PB_SUPERUSER_PASSWORD=ci-password-not-secret#' .env
          echo "OBSERVATOR_JOBS=off" >> .env
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Health
        run: curl -fsS http://localhost:3000/api/health
      - name: Build the example apps with the reporter image and the plain sh snippet
        run: |
          seed=$(docker compose exec -T web node --input-type=module - < scripts/e2e-seed.mjs)
          key=${seed% *}
          shared=${seed#* }
          OBSERVATOR_URL=http://host.docker.internal:3000 OBSERVATOR_KEY="$key" OBSERVATOR_SHARED_KEY="$shared" \
            examples/test-snippet.sh
      - name: Logs
        if: failure()
        run: docker compose logs --no-color

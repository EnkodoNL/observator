# Observator: web (Next.js) + pocketbase (database, internal only).
# Copy .env.example to .env and fill it in before the first `docker compose up --build`.

services:
  web:
    build:
      context: ./app
      args:
        # Optional: with OBSERVATOR_SELF_KEY set, this Observator reports its own Node version
        # and packages when its image is built. The project is created on the first report.
        OBSERVATOR_URL: ${OBSERVATOR_SELF_URL:-${APP_URL:-}}
        OBSERVATOR_KEY: ${OBSERVATOR_SELF_KEY:-}
    restart: unless-stopped
    env_file: .env
    environment:
      PB_URL: http://pocketbase:8090
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      pocketbase:
        condition: service_healthy

  pocketbase:
    build: ./pocketbase
    restart: unless-stopped
    environment:
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:?set PB_SUPERUSER_EMAIL in .env}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:?set PB_SUPERUSER_PASSWORD in .env}
    volumes:
      - pb_data:/pb/pb_data
    # Not published on purpose: only `web` talks to PocketBase. To reach the PocketBase
    # admin UI, uncomment this and use an SSH tunnel to 127.0.0.1:8090 on the host.
    # ports:
    #   - "127.0.0.1:8090:8090"

volumes:
  pb_data:

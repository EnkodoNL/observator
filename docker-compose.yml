# Observator: web (Next.js) + pocketbase (database, internal only).
# Copy .env.example to .env and fill it in before the first `docker compose up --build`.

services:
  web:
    build: ./app
    restart: unless-stopped
    env_file: .env
    environment:
      PB_URL: http://pocketbase:8090
    # No host port here: a reverse proxy (Coolify's Traefik) reaches the container over the Docker
    # network, and two installs on one host do not compete for a port. A plain `docker compose up`
    # also loads docker-compose.override.yml, which publishes it on localhost.
    expose:
      - "3000"
    depends_on:
      pocketbase:
        condition: service_healthy

  pocketbase:
    build: ./pocketbase
    restart: unless-stopped
    environment:
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:?set PB_SUPERUSER_EMAIL in .env}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:?set PB_SUPERUSER_PASSWORD in .env}
    volumes:
      - pb_data:/pb/pb_data
    # Not published on purpose: only `web` talks to PocketBase. To reach the PocketBase
    # admin UI, uncomment this and use an SSH tunnel to 127.0.0.1:8090 on the host.
    # ports:
    #   - "127.0.0.1:8090:8090"

volumes:
  pb_data:

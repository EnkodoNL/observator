# Observator: web (Next.js) + pocketbase (database, internal only).
# Copy .env.example to .env and fill it in before the first `docker compose up --build`.

services:
  web:
    build: ./app
    restart: unless-stopped
    env_file: .env
    environment:
      PB_URL: http://pocketbase:8090
    # Published on localhost only: a reverse proxy (Coolify's Traefik, Caddy, nginx) reaches the
    # container over the Docker network. Directly on a public port, any client could write its own
    # X-Forwarded-For and pass as an allowlisted address. WEB_BIND=0.0.0.0 publishes it anyway.
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      pocketbase:
        condition: service_healthy

  pocketbase:
    build: ./pocketbase
    restart: unless-stopped
    environment:
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:?set PB_SUPERUSER_EMAIL in .env}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:?set PB_SUPERUSER_PASSWORD in .env}
    volumes:
      - pb_data:/pb/pb_data
    # Not published on purpose: only `web` talks to PocketBase. To reach the PocketBase
    # admin UI, uncomment this and use an SSH tunnel to 127.0.0.1:8090 on the host.
    # ports:
    #   - "127.0.0.1:8090:8090"

volumes:
  pb_data:
